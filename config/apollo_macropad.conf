# --- ポインティングデバイス (PMW3610 トラックボール) ---
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y

# --- ロータリーエンコーダー (EC12) ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- ディスプレイ・ハードウェア設定 ---
CONFIG_ZMK_DISPLAY=y
# D10/D16ピンをGPIOとして解放する (OLEDに必須)
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- 省電力設定 ---
# 30秒でアイドル (OLED消灯など)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 15分でディープスリープ (Bluetooth切断)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- ZMK Studio (リアルタイム設定変更) ---
CONFIG_ZMK_STUDIO=y
